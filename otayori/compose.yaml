# おたより工房 + Tailscale（Dockge のスタックとして置く）
#
# おたより工房は Tailscale のコンテナとネットワークを共有するので、LAN にはポートを開けない。
# tailnet の端末から次で開ける。
#   http://otayori:8787                  （MagicDNS が有効なら）
#   https://otayori.<tailnet名>.ts.net    （tailnet で HTTPS を有効にしていれば）
#
# Dockge の「.env」に TS_AUTHKEY=tskey-auth-... を入れてから起動する。

services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-otayori}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  otayori:
    build: .
    image: otayori:local
    # Dockge の「更新」で作り直す。コードを入れかえたあとはこれで反映される
    pull_policy: build
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      # tailscale コンテナが起動し直したら、こちらも起動し直して新しいネットワークに入り直す
      - OTAYORI_WATCH_IFACE=tailscale0
    volumes:
      # APIキー（.env）・控え・自作のイラストはここに残る
      - ./data:/app/data
    restart: unless-stopped
